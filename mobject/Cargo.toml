[package]
name = "mobject"
version = "0.1.0"
edition = "2024"

[features]
default = ["validation_layers"]
validation_layers = []

[dependencies]
ash = "0.38.0"
dialoguer = {version = "0.12.0", features = ["fuzzy-select"] }
glfw = "0.61.0"
image = "0.25.9"
nalgebra = "0.34.2"
nalgebra-glm = "0.20.0"
ndarray = "0.17.2"
obj-rs = "0.7.4"
shapeject = { path = "../shapeject" }

[profile.release]
debug = true
